[workspace]
resolver = "3"
members = ["crates/ps2-core", "crates/ps2-app", "crates/ps2-debug"]

[workspace.package]
edition = "2024"
license = "MIT"

# The emulator hot loops need optimization even for debug builds, but keep our
# own crates light for fast iteration; dependencies get full optimization.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Dependencies are size-optimized; workspace members keep opt-level 3 because
# emulation speed lives in our own code.
[profile.release.package."*"]
opt-level = "s"
