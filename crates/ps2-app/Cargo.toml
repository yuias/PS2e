[package]
name = "ps2-app"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Native front-end for ps2-core: headless CLI plus an eframe/wgpu window"

# The executable is `ps2e`; the crate keeps its workspace name.
[[bin]]
name = "ps2e"
path = "src/main.rs"

# Control-port client. Declared rather than auto-discovered so it inherits
# nothing from the `ps2e` target: it is a bare TCP client and links none of
# the emulator, the window or the audio stack.
[[bin]]
name = "ps2ctl"
path = "src/bin/ps2ctl.rs"

[dependencies]
ps2-core = { path = "../ps2-core", features = ["threads", "jit"] }
ps2-debug = { path = "../ps2-debug" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# default features off: drops accesskit, links and the web screen reader.
# "wgpu_no_default_features" rather than "wgpu": the latter also enables
# egui-wgpu/default, which pulls wgpu/default -- every backend on every
# platform -- and cargo's additive features leave no way to subtract it.
eframe = { version = "0.36", default-features = false, features = [
    "wgpu_no_default_features",
    "default_fonts",
    "wayland", # Linux targets only; no cost on Windows
    "x11",     # Linux targets only; no cost on Windows
] }
cpal = "0.18"
serde = { version = "1", features = ["derive"] }
rfd = "0.17"
# Save states are ~40 MiB of mostly-zero machine state; zstd makes them
# cheap to write without the core needing a compressor.
zstd = "0.14"
# Already in the tree through eframe, so PNG screenshots cost no new build.
png = "0.18"
toml = "1.1"
gilrs = "0.11.2"

# One native wgpu backend per OS keeps naga's shader translators to a single
# target language. Excludes gles/webgpu everywhere.
[target.'cfg(windows)'.dependencies]
wgpu = { version = "30", default-features = false, features = ["dx12", "std", "wgsl"] }

[target.'cfg(target_os = "linux")'.dependencies]
wgpu = { version = "30", default-features = false, features = ["vulkan", "std", "wgsl"] }

[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { version = "30", default-features = false, features = ["metal", "std", "wgsl"] }

[features]
# Print a TSC-based subsystem time breakdown at exit.
profile = ["ps2-core/profile"]
