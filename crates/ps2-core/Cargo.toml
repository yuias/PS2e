[package]
name = "ps2-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Platform-independent PS2 emulator core (wasm-safe)"

[dependencies]
tracing = "0.1"
rayon = { version = "1", optional = true }
dynasm = { version = "3", optional = true }
dynasmrt = { version = "3", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Memory"], optional = true }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }

[features]
default = []
# TSC-based subsystem time accounting (see prof.rs).
profile = []
# Run the GS renderer on a worker thread (native only; wasm keeps it inline).
threads = ["dep:rayon"]
# x86-64 dynamic recompiler for the EE (native only).
jit = ["dep:dynasm", "dep:dynasmrt", "dep:windows-sys", "dep:libc"]
